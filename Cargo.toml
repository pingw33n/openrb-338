[workspace]
resolver = "3"
members = ["crates/rbs", "crates/rb-engine", "crates/rb-cli", "crates/rbm", "crates/rb-player", "crates/rb-ui-art", "crates/rb-ui", "crates/rb-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# The SHA-256 of the 128 MB RB20FUL.DAT (rbm::dat) takes seconds unoptimized: the tests of
# `rb mod recrypt` hash a stand-in file several times.
[profile.dev.package.sha2]
opt-level = 3
