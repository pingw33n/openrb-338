# The renderer of the redesign mockup (task-179): SVG to PNG with resvg, the renderer the app
# uses, and the fonts of a given folder. Temporary, like the rest of mockup/179: it is not a
# member of the workspace (the empty [workspace] table keeps cargo from looking for one). Build:
#   cargo build --release --manifest-path mockup/179/render/Cargo.toml --target-dir target/mockup-render
[package]
name = "render"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
resvg = "=0.49.0"
