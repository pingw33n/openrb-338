[package]
name = "rb-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The desktop UI: the panel drawn from the SVG art set (assets/ui) with egui"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rb-ui"
path = "src/main.rs"

[dependencies]
rb-engine = { path = "../rb-engine" }
# The player the panel drives (task-045) and its audio output.
rb-player = { path = "../rb-player" }
# Song files and the standard mod (the built-in drum samples).
rbs = { path = "../rbs" }
rbm = { path = "../rbm" }
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
# Saves the --screenshot PNG.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
rb-ui-art = { path = "../rb-ui-art" }
tempfile = "3.27.0"
