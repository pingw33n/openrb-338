[package]
name = "rb-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The desktop UI: the panel drawn from the SVG art set (assets/ui) with egui"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rb-ui"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
# Saves the --screenshot PNG.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
rb-ui-art = { path = "../rb-ui-art" }
