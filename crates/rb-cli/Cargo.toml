[package]
name = "rb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rb_cli"
path = "src/lib.rs"

[[bin]]
name = "rb"
path = "src/main.rs"

[dependencies]
rbs = { path = "../rbs" }
rb-engine = { path = "../rb-engine" }
rbm = { path = "../rbm" }
# rb play.
rb-player = { path = "../rb-player" }
clap = { version = "4.6.7", features = ["derive"] }
flacenc = "0.5.1"
vorbis_rs = "0.5.6"
# rb compare: the FLAC references, the manifest and the WAVs' sha256.
claxon = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
