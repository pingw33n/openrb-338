[package]
name = "rb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rb"
path = "src/main.rs"

[dependencies]
rbs = { path = "../rbs" }
rb-engine = { path = "../rb-engine" }
clap = { version = "4.6.7", features = ["derive"] }
flacenc = "0.5.1"
vorbis_rs = "0.5.6"

[dev-dependencies]
claxon = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.10"
tempfile = "3.27.0"
