[package]
name = "rb-ui-art"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generator and render check of the panel's SVG art set (assets/ui)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ui-art"
path = "src/main.rs"

[dependencies]
# resvg re-exports usvg and tiny-skia: the same renderer egui_extras' SVG loader uses.
resvg = "0.49.0"
