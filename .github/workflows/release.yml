# Builds the packages of rb (the CLI) and OpenRB-338 (the UI) for the six targets on native
# runners and uploads them as workflow artifacts (task-108). Runs on a release tag (v*) or by
# hand. Needs no secret, and fetches no Propellerhead file: the standard mod is in the
# repository (assets/Standard.rbm). The draft release, the installers, the .dmg and the
# AppImages build on this file (tasks 110 to 113): `bin-<target>` holds the binaries they pack.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    # One build time and one main/not-main flag for every package of the run.
    runs-on: ubuntu-latest
    outputs:
      source_date_epoch: ${{ steps.env.outputs.SOURCE_DATE_EPOCH }}
      build_branch: ${{ steps.env.outputs.RB_BUILD_BRANCH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: env
        run: scripts/release-env.sh | tee -a "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on the oldest Ubuntu LTS runner, so the binaries need glibc 2.35 only.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
      RB_BUILD_BRANCH: ${{ needs.prepare.outputs.build_branch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install rustup (the Windows arm64 image has none)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSfL -o rustup-init.exe \
              https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build and package
        run: scripts/package.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/OpenRB-338-*.tar.gz
            dist/${{ matrix.target }}/OpenRB-338-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/${{ matrix.target }}/bin/
          retention-days: 1
          if-no-files-found: error

  dmg:
    # The macOS .dmg (task-110): one universal OpenRB-338.app (lipo of the two macOS builds)
    # with the CLI inside, signed ad hoc only (no Developer ID, no notarization).
    name: dmg
    needs: [prepare, package]
    runs-on: macos-15
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
      RB_BUILD_BRANCH: ${{ needs.prepare.outputs.build_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: bin-*-apple-darwin
          path: dist-in
      - name: Lay out the two builds
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "dist/$t"
            mv "dist-in/bin-$t" "dist/$t/bin"
            chmod +x "dist/$t/bin/"*
          done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: dmg
      - name: Build the .dmg
        run: SKIP_BUILD=1 scripts/package-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/universal-apple-darwin/OpenRB-338-*.dmg
          if-no-files-found: error

  installer:
    # The Windows installers (task-111): NSIS, one per architecture, from the Windows `bin-`
    # artifacts of the package jobs. makensis runs on Linux (apt install nsis), so the job
    # needs no Windows runner and no Rust. The installers are not signed.
    name: installer (${{ matrix.arch }})
    needs: [prepare, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: x64 }
          - { target: aarch64-pc-windows-msvc, arch: arm64 }
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
      # Ubuntu's apt NSIS is 3.08 (windows-latest ships none: NSIS is not in the runner-images
      # list), the script was checked with 3.13: no -WX here, so a warning of the older
      # makensis does not stop a release.
      MAKENSIS_FLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bin-${{ matrix.target }}
          path: dist/${{ matrix.target }}/bin
      - name: Build the installer
        run: SKIP_BUILD=1 scripts/package-installer.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.arch }}
          path: dist/${{ matrix.target }}/OpenRB-338-*-setup.exe
          if-no-files-found: error

  appimage:
    # The Linux AppImages (task-112), one per architecture on the oldest LTS runner of that
    # architecture (glibc 2.35), from the Linux `bin-` artifacts of the package jobs.
    # appimagetool runs with --appimage-extract-and-run (no FUSE needed). Cargo is needed for
    # the icons only (ui-art). The smoke test runs the AppImage in a stock ubuntu:22.04
    # container. The AppImages are not signed.
    name: appimage (${{ matrix.arch }})
    needs: [prepare, package]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, arch: x86_64, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, arch: aarch64, os: ubuntu-22.04-arm }
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the ALSA headers (ui-art links the workspace's cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bin-${{ matrix.target }}
          path: dist/${{ matrix.target }}/bin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: appimage-${{ matrix.arch }}
      - name: Build the AppImage
        run: |
          chmod +x "dist/${{ matrix.target }}/bin/"*
          SKIP_BUILD=1 scripts/package-appimage.sh "${{ matrix.target }}"
      - name: Smoke test in ubuntu:22.04
        run: scripts/appimage-smoke.sh dist/${{ matrix.target }}/OpenRB-338-*-${{ matrix.arch }}.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/${{ matrix.target }}/OpenRB-338-*.AppImage
          if-no-files-found: error
